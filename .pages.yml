media:
  input: assets
  output: assets

content:
  - name: home
    label: 首页 / Home
    type: file
    path: data/site.json
    format: json
    fields:
      - name: hero
        label: 首屏 Hero
        type: object
        fields:
          - name: eyebrow
            label: 标签行
            type: string
          - name: title
            label: 大标题（可含 &lt;br&gt; 与 &lt;span&gt;）
            type: rich-text
          - name: hero_cn
            label: 中文头衔
            type: string
          - name: meta
            label: 副信息（中文）
            type: string
          - name: meta_en
            label: 副信息（英文）
            type: string
          - name: image
            label: 首屏图片
            type: image
          - name: image_alt
            label: 图片说明文字
            type: string
      - name: profile
        label: 关于我
        type: object
        fields:
          - name: statement
            label: 主句（中文）
            type: rich-text
          - name: statement_en
            label: 主句（英文）
            type: text
          - name: note
            label: 说明
            type: text
      - name: skills
        label: 专业能力
        type: object
        list: true
        fields:
          - name: index
            label: 编号
            type: string
          - name: name
            label: 名称（中文）
            type: string
          - name: en
            label: 名称（英文）
            type: string
      - name: projects
        label: 精选项目
        type: object
        list: true
        fields:
          - name: index
            label: 序号（如 01 / 04）
            type: string
          - name: title
            label: 项目名称
            type: string
          - name: subtitle
            label: 中文副标题
            type: string
          - name: role
            label: 英文角色
            type: string
          - name: image
            label: 封面图
            type: image
          - name: alt
            label: 图片说明文字
            type: string
          - name: href
            label: 案例页链接（留空则无链接）
            type: string
          - name: offset
            label: 错位排版
            type: boolean
      - name: process
        label: 工作方法
        type: object
        list: true
        fields:
          - name: cn
            label: 步骤（中文）
            type: string
          - name: en
            label: 步骤（英文）
            type: string
          - name: note
            label: 说明
            type: string
      - name: footer
        label: 页脚
        type: object
        fields:
          - name: cn
            label: 中文标语
            type: string
          - name: en
            label: 英文标语
            type: string
          - name: sign
            label: 署名
            type: string

  - name: cases
    label: 案例页 / Case Studies
    type: group
    items:
      - name: imon
        label: IMON 野萌体验馆
        type: file
        path: data/cases/imon.json
        format: json
        fields:
          - name: nav_label
            label: 导航标签
            type: string
          - name: eyebrow
            label: 页眉标签
