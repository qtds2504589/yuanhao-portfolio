name: Deploy to Aliyun OSS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ossutil
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64 -o /usr/local/bin/ossutil
          chmod +x /usr/local/bin/ossutil

      - name: Sync to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
        run: |
          rm -rf .git .github
          ossutil cp -r ./ "oss://$OSS_BUCKET/" \
            --endpoint "$OSS_ENDPOINT" \
            --access-key-id "$OSS_ACCESS_KEY_ID" \
            --access-key-secret "$OSS_ACCESS_KEY_SECRET" \
            -f

      - name: Fix Content-Disposition on all HTML files
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
        run: |
          # 列出所有 html 文件，逐个 set-meta 去掉 attachment
          ossutil ls "oss://$OSS_BUCKET/" \
            --endpoint "$OSS_ENDPOINT" \
            --access-key-id "$OSS_ACCESS_KEY_ID" \
            --access-key-secret "$OSS_ACCESS_KEY_SECRET" \
            --limited-num 1000 | grep '\.html' | awk '{print $1}' | while read f; do
              ossutil set-meta "$f" "Content-Type:text/html; charset=utf-8" "Content-Disposition:inline" \
                --endpoint "$OSS_ENDPOINT" \
                --access-key-id "$OSS_ACCESS_KEY_ID" \
                --access-key-secret "$OSS_ACCESS_KEY_SECRET" \
                --update
              echo "Fixed: $f"
          done
          echo "All HTML files fixed"
