name: Deploy to Aliyun OSS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install oss2
        run: pip install oss2

      - name: Sync to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
        run: |
          rm -rf .git .github
          python3 << 'EOF'
          import os, oss2
          auth = oss2.Auth(os.environ['OSS_ACCESS_KEY_ID'], os.environ['OSS_ACCESS_KEY_SECRET'])
          bucket = oss2.Bucket(auth, 'https://' + os.environ['OSS_ENDPOINT'], os.environ['OSS_BUCKET'])
          ct_map = {'.html': 'text/html; charset=utf-8', '.css': 'text/css; charset=utf-8', '.js': 'application/javascript; charset=utf-8',
                    '.png': 'image/png', '.jpg': 'image/jpeg', '.jpeg': 'image/jpeg', '.gif': 'image/gif',
                    '.svg': 'image/svg+xml', '.webp': 'image/webp', '.ico': 'image/x-icon', '.woff': 'font/woff',
                    '.woff2': 'font/woff2', '.ttf': 'font/ttf', '.pdf': 'application/pdf'}
          count = 0
          for root, dirs, files in os.walk('.'):
              for f in files:
                  local = os.path.join(root, f)
                  key = os.path.relpath(local, '.').replace('\\', '/')
                  ext = os.path.splitext(f)[1].lower()
                  ct = ct_map.get(ext, 'application/octet-stream')
                  bucket.put_object_from_file(key, local, headers={'Content-Type': ct})
                  count += 1
                  if count % 50 == 0:
                      print(f'Uploaded {count} files...')
          print(f'Done: {count} files uploaded')
          EOF
